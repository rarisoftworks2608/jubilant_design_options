<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jubilant Design Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@400;500;600&display=swap">
<style>
  /* Phone-first review page: a sticky A–F switcher, then one section per
     option with its palette, fonts and a phone/computer preview. */
  :root {
    --bg: #eef0f2;
    --surface: #ffffff;
    --ink: #16161a;
    --muted: #5d5f66;
    --line: #dfe1e5;
    --gold: #9a7443;
    --gold-soft: rgba(154, 116, 67, 0.12);
    --frame: #111114;
    --display: 'Playfair Display', Georgia, serif;
    --body: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111215; --surface: #1a1b20; --ink: #eeeef1; --muted: #a3a5ad;
      --line: #2b2d33; --gold: #d2ad70; --gold-soft: rgba(210, 173, 112, 0.14); --frame: #000000;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111215; --surface: #1a1b20; --ink: #eeeef1; --muted: #a3a5ad;
    --line: #2b2d33; --gold: #d2ad70; --gold-soft: rgba(210, 173, 112, 0.14); --frame: #000000;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 60px; }

  header.intro { display: flex; flex-direction: column; gap: 12px; padding-block: 12px 22px; max-width: 640px; }
  .logo { height: 40px; width: auto; align-self: flex-start; filter: brightness(0); }
  :root[data-theme="dark"] .logo { filter: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo { filter: none; } }
  h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 7vw, 46px); line-height: 1.1; margin: 0; text-wrap: balance; }
  h1 em { color: var(--gold); font-weight: 500; }
  .lead { margin: 0; color: var(--muted); font-size: 16px; }

  /* Sticky option switcher */
  .switcher {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 10px 16px; margin-inline: -16px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .switcher::-webkit-scrollbar { display: none; }
  .switcher a {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 12px; background: var(--surface);
    border: 1px solid var(--line); color: var(--ink); text-decoration: none;
    font-size: 13.5px; font-weight: 500; white-space: nowrap;
  }
  .switcher a b { font-family: var(--display); color: var(--gold); font-size: 16px; }
  .switcher a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Option sections */
  .option { scroll-margin-top: 70px; padding-block: 34px 10px; border-bottom: 1px solid var(--line); }
  .opt-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  @media (min-width: 860px) { .opt-head { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; } }
  .opt-title { margin-bottom: 4px; display: flex; align-items: baseline; gap: 14px; }
  .letter { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 52px; line-height: 1; color: var(--gold); }
  h2 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 5.5vw, 34px); line-height: 1.15; margin: 0; }
  .mood { margin: 10px 0 0; color: var(--muted); }
  .best { margin: 10px 0 0; font-size: 14px; }
  .best b { color: var(--gold); font-weight: 600; }

  .spec { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .label { font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 6px; }
  .sw { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .sw i { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); flex-shrink: 0; }
  .sw b { display: block; color: var(--ink); font-weight: 500; font-size: 13px; line-height: 1.2; }
  .fonts { font-size: 14px; }
  details { font-size: 14px; }
  summary { cursor: pointer; font-weight: 500; color: var(--gold); }
  details ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }

  /* Preview */
  .views { display: flex; gap: 8px; margin: 24px 0 14px; }
  .views button {
    font: inherit; font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .preview { position: relative; overflow: hidden; max-height: 760px; border-radius: 18px; }
  .preview.open { max-height: none; }
  .preview::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 160px; pointer-events: none;
    background: linear-gradient(180deg, transparent, var(--bg));
  }
  .preview.open::after { display: none; }
  .shot-phone { display: block; width: 100%; max-width: 390px; margin: 0 auto; border-radius: 26px; border: 8px solid var(--frame); }
  .shot-desktop { display: block; width: 100%; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); }
  .more { display: flex; justify-content: center; margin: 14px 0 24px; }
  .more button {
    font: inherit; font-size: 14px; font-weight: 600; padding: 12px 22px; border-radius: 12px;
    border: 1px solid var(--gold); background: var(--gold-soft); color: var(--ink); cursor: pointer;
  }

  footer.choose { padding-block: 40px 10px; display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
  footer.choose h2 { font-size: clamp(24px, 5vw, 30px); }
  footer.choose p { margin: 0; color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>


<div class="page">
  <header class="intro">
    <img class="logo" src="img/logo-white.png" alt="Jubilant Events &amp; Productions">
    <h1>Website <em>designs</em></h1>
  </header>

  <nav class="switcher" aria-label="Design options">
    <a href="#a"><b>A</b>Cinematic Glow</a>
    <a href="#c"><b>C</b>Bright Studio</a>
    <a href="#g"><b>G</b>Midnight Pulse</a>
    <a href="#h"><b>H</b>Live Frame</a>
  </nav>

  <section class="option" id="a" data-key="a">
    <div class="opt-title"><span class="letter">A</span><h2>Cinematic Glow</h2></div>
    <div class="views" role="group" aria-label="Preview size"><button type="button" data-view="mobile" aria-pressed="true">Phone view</button><button type="button" data-view="desktop" aria-pressed="false">Computer view</button></div>
    <div class="preview"><img class="shot-phone" src="img/a-mobile.jpg" alt="Option A on a phone" loading="lazy"><img class="shot-desktop" src="img/a-desktop.jpg" alt="Option A on a computer" loading="lazy" hidden></div>
    <div class="more"><button type="button">Show full homepage</button></div>
  </section>

  <section class="option" id="c" data-key="c">
    <div class="opt-title"><span class="letter">C</span><h2>Bright Studio</h2></div>
    <div class="views" role="group" aria-label="Preview size"><button type="button" data-view="mobile" aria-pressed="true">Phone view</button><button type="button" data-view="desktop" aria-pressed="false">Computer view</button></div>
    <div class="preview"><img class="shot-phone" src="img/c-mobile.jpg" alt="Option C on a phone" loading="lazy"><img class="shot-desktop" src="img/c-desktop.jpg" alt="Option C on a computer" loading="lazy" hidden></div>
    <div class="more"><button type="button">Show full homepage</button></div>
  </section>

  <section class="option" id="g" data-key="g">
    <div class="opt-title"><span class="letter">G</span><h2>Midnight Pulse</h2></div>
    <div class="views" role="group" aria-label="Preview size"><button type="button" data-view="mobile" aria-pressed="true">Phone view</button><button type="button" data-view="desktop" aria-pressed="false">Computer view</button></div>
    <div class="preview"><img class="shot-phone" src="img/g-mobile.jpg" alt="Option G on a phone" loading="lazy"><img class="shot-desktop" src="img/g-desktop.jpg" alt="Option G on a computer" loading="lazy" hidden></div>
    <div class="more"><button type="button">Show full homepage</button></div>
  </section>

  <section class="option" id="h" data-key="h">
    <div class="opt-title"><span class="letter">H</span><h2>Live Frame</h2></div>
    <div class="views" role="group" aria-label="Preview size"><button type="button" data-view="mobile" aria-pressed="true">Phone view</button><button type="button" data-view="desktop" aria-pressed="false">Computer view</button></div>
    <div class="preview"><img class="shot-phone" src="img/h-mobile.jpg" alt="Option H on a phone" loading="lazy"><img class="shot-desktop" src="img/h-desktop.jpg" alt="Option H on a computer" loading="lazy" hidden></div>
    <div class="more"><button type="button">Show full homepage</button></div>
  </section>
</div>

<script>
  document.querySelectorAll('.option').forEach(function (section) {
    var preview = section.querySelector('.preview');
    var phone = section.querySelector('.shot-phone');
    var desktop = section.querySelector('.shot-desktop');
    var more = section.querySelector('.more button');
    section.querySelectorAll('.views button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var isPhone = btn.dataset.view === 'mobile';
        phone.hidden = !isPhone;
        desktop.hidden = isPhone;
        section.querySelectorAll('.views button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b === btn));
        });
      });
    });
    more.addEventListener('click', function () {
      var open = preview.classList.toggle('open');
      more.textContent = open ? 'Show less' : 'Show full homepage';
      if (!open) section.scrollIntoView({ block: 'start' });
    });
  });
</script>

</body>
</html>
